# Regenerates the dynamic panels of the profile README and publishes them to the
# `output` branch, so `main` stays clean:
#
#   output/blotter-{dark,light}.svg   <- scripts/panels.py      recent activity as order fills
#   output/ledger-{dark,light}.svg    <- scripts/panels.py      language allocation + repo totals
#   output/snake-{dark,light}.svg     <- Platane/snk, framed by scripts/frame_snake.py
#
# The README embeds these via raw.githubusercontent.com/HimanshuJ16/HimanshuJ16/output/...
name: Refresh profile panels

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (off the top of the hour to dodge queueing)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-panels
  cancel-in-progress: true

jobs:
  panels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render blotter and ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/panels.py --user "${{ github.repository_owner }}" --out dist

      - name: Render contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            raw/snake-light.svg?palette=github-light&color_dots=#EBEDF0,#9BE9A8,#40C463,#30A14E,#216E39&color_snake=#9A6700
            raw/snake-dark.svg?palette=github-dark&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353&color_snake=#E3B341
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Frame the snake to match the other panels
        run: |
          python3 scripts/frame_snake.py raw/snake-dark.svg dist/snake-dark.svg dark
          python3 scripts/frame_snake.py raw/snake-light.svg dist/snake-light.svg light

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh profile panels"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
